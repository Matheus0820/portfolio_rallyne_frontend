<section class="login">
  <div class="login__panel">
    <a routerLink="/" class="login__brand">
      <img src="assets/logo/logo-full.png" alt="Rallyne Silva Fotografia" />
    </a>

    <h1>Área da fotógrafa</h1>
    <p class="login__subtitle">Entre para gerenciar os eventos do portfólio.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      <p class="login__error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" class="btn btn-primary login__submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <a routerLink="/" class="login__back">← Voltar para o site</a>
  </div>
</section>
