<footer class="footer">
  <div class="container footer__inner">
    <img src="assets/logo/icon-mark.png" alt="" class="footer__mark" aria-hidden="true" />

    <div class="footer__text">
      <p class="footer__name">Rallyne Silva Fotografia</p>
      <p class="footer__tag">Ensaios, casamentos e eventos — luz natural e histórias reais.</p>
    </div>

    <div class="footer__links">
      <a href="https://www.instagram.com/rallynefotografia" target="_blank" rel="noopener">&#64;rallynefotografia</a>
      <a [href]="whatsappUrl" target="_blank" rel="noopener">WhatsApp: {{ whatsappDisplay }}</a>
      <a routerLink="/login">Área da fotógrafa</a>
    </div>
  </div>

  <p class="footer__copy">© {{ year }} Rallyne Silva Fotografia. Todos os direitos reservados.</p>
</footer>
